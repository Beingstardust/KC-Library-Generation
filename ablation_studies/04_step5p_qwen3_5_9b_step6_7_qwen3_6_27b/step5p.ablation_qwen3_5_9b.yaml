inputs:
  registry_jsonl: ""
  source_overlay_jsonl: ""
  exact_kc_ids: []
  limit_kcs: null

outputs:
  output_root: "data/processed/kc_retrieval_profiles"
  set_manifest_root: "data/processed/kc_retrieval_profiles/_sets"

behavior:
  use_model: true
  llm_policy: "always"
  max_snippets_per_kc: 20
  min_snippet_score: 4.0
  dynamic_broad_token_min_df: 12
  checkpoint_every: 5

model:
  provider: "ollama"
  base_url: "http://localhost:11434"
  model: "qwen3.5:9b"
  context_length: 32768
  temperature: 0
  # Mirrors production step5p.hpc.production_gemma4_31b.yaml's own seed-reproducibility
  # note verbatim (model_client.py's ollama_chat_json): temperature=0 alone is not proven
  # sufficient for reproducible output across separate Ollama calls; a fixed seed is
  # necessary but not sufficient (GPU floating-point non-associativity is a separate,
  # unaddressed variance source). Same seed value as production, for consistency across
  # this ablation's own comparisons.
  seed: 20260727
  # 2026-08-02 (Ablation 4): qwen3.5:9b confirmed this session (real pipeline function
  # ollama_chat_json, controlled diagnostic) to hang indefinitely under think=false - it
  # routes its entire answer into response.thinking instead of response.response when
  # think isn't explicitly set true, so response.response is empty and the caller never
  # gets a terminating payload. think=false worked for gemma4:12b/qwen3.6:27b; this model
  # needs the opposite setting, confirmed via a raw /api/chat diagnostic before trusting it.
  think: true
  # Raised from the gemma4:12b ablation's 240s: a real think=true call for this model was
  # timed at ~75s total_duration for a single KC in the earlier verification diagnostic -
  # generous headroom against per-call variance, not a hard requirement.
  timeout_seconds: 600
