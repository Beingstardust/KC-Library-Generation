# Diagnostic variant of step5_3.hpc.actual_corpus.yaml (2026-07-30): neutralizes the
# reranker's influence on admission outcomes, WITHOUT touching any code. The reranker model
# still runs (this file doesn't disable that), but its scores are made irrelevant to every
# decision that currently depends on them:
#   - scoring.weights.rerank_target/rerank_margin set to 0.0 -> zero contribution to final_score
#     (and to candidate_sort_key, which reads final_score directly).
#   - every rerank_target/rerank_margin threshold in scoring.thresholds is set to a value that
#     can never fail its own comparison direction (checked directly against
#     finalize_candidate()'s real comparison operators in run_step5_3.py):
#       ">="-gated (rerank_target_min, rerank_margin_min, exact_phrase_rerank_target_min,
#       exact_phrase_rerank_margin_min, multi_token_rerank_margin_min,
#       doc_mismatch_rerank_target_min, doc_mismatch_rerank_margin_min) -> -999.0, always >= true
#       "<"-gated (high_risk_negative_margin, strong_doc_mismatch_override_margin) -> -999.0,
#       rerank_margin (a logistic-difference, bounded in [-1, 1]) can never be < -999.0
# Net effect: strong_same_topic, contamination_risk/contamination_signals, final_score, and
# candidate ordering all become fully independent of the reranker's output - equivalent to the
# reranker not existing, without literally skipping its (harmless, just unused) computation.
# All non-reranker scoring/penalties/selection/acceptance values are untouched, byte-identical
# to step5_3.hpc.actual_corpus.yaml.

project:
  timezone: Europe/Berlin

inputs:
  kc_registry_path: data/work/cache/current_step_artifacts/step1_seedless_hierarchy_registry.current.jsonl
  step4_5_active_set_pointer: /path/to/scratch/kc_l/data/processed/retrieval_sentence_overlay/_sets/ACTIVE_STEP4_5_SET.txt
  baseline_step5_2_active_set_pointer: data/processed/kc_evidence_sharp/_sets/ACTIVE_STEP5_2_EVIDENCE_SHARP_SET.txt
  active_step5_3_set_pointer: data/processed/kc_evidence_recalibrated/_sets/ACTIVE_STEP5_3_EVIDENCE_SET.txt

models:
  reranker:
    preferred: /path/to/scratch/kc_l/models/rerankers/tomaarsen__Qwen3-Reranker-8B-seq-cls
    fallback:
      - /path/to/scratch/kc_l/models/rerankers/BAAI__bge-reranker-v2-m3
    device: auto
    batch_size: 8

runtime:
  competitor_pool_size: 12
  heuristic_shortlist_per_kc: 64
  review_queue_min_strong_candidates: 2
  review_examples_per_kc: 5
  sample_kcs: 12
  contamination_audit_top_k: 5
  contamination_audit_subset:
    - KC_CLF_DT_003
    - KC_CLF_DT_004
    - KC_CLF_DT_006
    - KC_CLF_NB_001
    - KC_CLF_NB_004
    - KC_CLU_EVAL_005
    - KC_CLU_SIM_006
    - KC_FSEL_FUND_004

selection:
  max_candidates_per_kc: 18
  max_candidates_per_doc: 6
  max_candidates_per_page: 3
  reserve_structured_candidates: 2
  reserve_definition_anchor_candidates: 3
  reserve_explanatory_anchor_candidates: 2
  reserve_context_completion_candidates: 1
  max_formula_auxiliary_candidates: 2
  max_formula_only_candidates_without_definition_anchor: 1

scoring:
  weights:
    exact_name_phrase: 5.0
    exact_alias_phrase: 4.0
    canonical_token: 2.0
    alias_token: 1.5
    context_keyword: 0.9
    heading_name_token: 0.6
    doc_group_match: 1.8
    definition_like: 1.8
    formula_like: 1.8
    procedure_like: 1.4
    example_like: 0.5
    page_index_present: 0.3
    patch_id_present: 0.3
    canonical_reveal_page: 0.4
    rerank_target: 0.0
    rerank_margin: 0.0
  support_profile_weights:
    strong_definition_anchor: 3.0
    usable_definition_anchor: 1.5
    explanatory_anchor: 1.0
    context_completion_available: 1.25
    formula_auxiliary_penalty: 2.0
    contamination_exclusion_penalty: 1.5
  penalties:
    is_meta: 5.0
    is_nav_boilerplate: 6.0
    is_author_affiliation: 8.0
    is_transition_text: 4.0
    is_heading_like: 0.8
    missing_page_index: 0.8
    missing_patch_id: 0.4
    noncanonical_reveal_page: 0.4
    doc_group_mismatch: 4.5
    competitor_token_hit: 1.0
    short_sentence: 1.2
    very_short_sentence: 2.5
  thresholds:
    short_sentence_chars: 42
    very_short_sentence_chars: 18
    strong_context_overlap_min: 1
    rerank_target_min: -999.0
    rerank_margin_min: -999.0
    exact_phrase_rerank_target_min: -999.0
    exact_phrase_rerank_margin_min: -999.0
    multi_token_rerank_margin_min: -999.0
    doc_mismatch_rerank_target_min: -999.0
    doc_mismatch_rerank_margin_min: -999.0
    strong_doc_mismatch_override_margin: -999.0
    high_risk_negative_margin: -999.0
    top_candidate_suppressed_max: 6

outputs:
  processed_root: data/processed/kc_evidence_recalibrated
  sets_dir: data/processed/kc_evidence_recalibrated/_sets

audit:
  runs_dir: data/runs

acceptance:
  n_kcs_total: 144
  max_candidates_per_kc: 18
  min_median_same_topic_fraction_lift_vs_step5_2: 0.05
  min_median_same_topic_fraction_relative_lift_vs_step5_2: 0.25
  min_kcs_with_2_strong_candidates: 100
  max_top_candidate_suppressed: 6
  max_high_risk_audit_candidates: 8
