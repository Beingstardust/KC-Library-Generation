# Clean-start bounded template for the operator repo.
# Refresh current artifact aliases with: python scripts/maintenance/refresh_current_step_artifacts.py
inputs:
  step6_6_set_manifest: data/work/cache/current_step_artifacts/step6_6_set_manifest.current.json

outputs:
  processed_root: data/processed/kc_drafts
  sets_root: data/processed/kc_drafts/_sets
  runs_root: data/runs

slice:
  limit_kcs: 10
  exact_kc_ids:
    - KC_CLF_DT_008
    - KC_CLF_DT_011
    - KC_CLF_UND_001
    - KC_CLF_DT_004
    - KC_CLF_NB_001
    - KC_CLU_EVAL_005
    - KC_CLF_NB_004
    - KC_CLF_DT_003
    - KC_CLF_DT_006
    - KC_CLF_DT_001

selection:
  max_bundle_size: 4
  max_explanatory_candidates: 3


