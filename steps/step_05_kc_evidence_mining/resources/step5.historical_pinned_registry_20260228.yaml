project:
  timezone: Europe/Berlin

inputs:
  kc_registry_path: data/processed/hierarchy/20260228T211719Z/kc_registry.jsonl
  step4_active_set_pointer: data/processed/retrieval_index/_sets/ACTIVE_STEP4_SET.txt

retrieval:
  per_kc:
    max_queries_per_kc: 3
    top_patches_per_doc: 6
    top_blocks_per_doc: 12
    max_blocks_per_kc: 30
  dedupe:
    dedupe_key: doc_id+block_id
    dedupe_by_text_fingerprint_within_reveal_group: true
  scoring:
    source: reuse_frozen_step4_run_config

outputs:
  processed_root: data/processed/kc_evidence
  sets_dir: data/processed/kc_evidence/_sets

audit:
  runs_dir: data/runs

runtime:
  seed_definition_max_chars: 240
  keyword_query_max_terms: 8
  query_embed_batch_size: 32
  review_queue_min_unique_blocks: 2
  sample_kcs: 10
  diversity_score_tolerance: 0.05
