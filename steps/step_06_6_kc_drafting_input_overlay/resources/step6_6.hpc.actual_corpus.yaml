inputs:
  step4_active_set_pointer: /path/to/scratch/kc_l/data/processed/retrieval_index/_sets/ACTIVE_STEP4_SET.txt
  step4_5_active_set_pointer: /path/to/scratch/kc_l/data/processed/retrieval_sentence_overlay/_sets/ACTIVE_STEP4_5_SET.txt
  step5_3_active_set_pointer: data/processed/kc_evidence_recalibrated/_sets/ACTIVE_STEP5_3_EVIDENCE_SET.txt
  hierarchy_overlay_manifest: data/work/cache/current_step_artifacts/step1_5_overlay_manifest.current.json
outputs:
  processed_root: data/processed/kc_drafting_input_overlay
  sets_root: data/processed/kc_drafting_input_overlay/_sets
  runs_root: data/runs
# 2026-07-26 fix: limit_kcs/exact_kc_ids were previously hardcoded to a frozen 144-KC snapshot
# (this file's own name is "actual_corpus" - full-corpus production, not a deliberate testing
# slice like the sibling slice24/slice48 configs elsewhere in this repo). The current hierarchy
# has 159 KCs. In practice this fallback is dead code for the live orchestrator path - run_
# step6_6_kc_drafting_input_overlay.py always prefers the dynamic assembly_bridge_info branch
# (exact_kc_ids derived from THIS run's own real evidence_packs_by_kc) whenever
# --step6-input-assembly-manifest is wired, which build_step6_6_run_config() always passes
# (see kc_l_orchestrator.py's step_06_6 call site) - but if that manifest were ever empty, this
# frozen list would silently cap every future run's real output to the same 144 historical KCs
# forever, with no error (all 144 IDs still validly exist in any registry >= 144 rows - see
# select_kc_subset()'s exact_kc_ids branch, which only raises for MISSING ids, never for a
# registry being larger than the configured list). null/empty here (matching step5p's own
# already-correct "no restriction" pattern) makes select_kc_subset() fall through to processing
# the FULL real registry instead, so this can never silently under-cover new KCs again.
slice:
  limit_kcs: null
  exact_kc_ids: []
provenance:
  layer_preference:
  - mineru
  - pymupdf
  - docling
role_hints:
  enabled: true
