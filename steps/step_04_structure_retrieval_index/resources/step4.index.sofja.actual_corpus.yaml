schema_version: 1
stage: step4_3_build_index

inputs:
  step3_set_active: /beegfs2/scratch/aryp26yc/kc_l/data/processed/doctree/_sets/ACTIVE_STEP3_SET.txt
  step3_6_set_active: /beegfs2/scratch/aryp26yc/kc_l/data/processed/blockstore_math_salvaged/_sets/ACTIVE_STEP3_6_SET.txt
  step4_patches_set_active: /beegfs2/scratch/aryp26yc/kc_l/data/processed/retrieval_index/_sets/ACTIVE_STEP4_PATCHES_SET.txt
  hierarchy_kc_registry: /beegfs2/scratch/aryp26yc/kc_l/data/processed/hierarchy/2026-04-06_revised_registry/kc_registry_revised_actual_corpus.jsonl

outputs:
  retrieval_root: /beegfs2/scratch/aryp26yc/kc_l/data/processed/retrieval_index

runtime:
  run_id: auto
  utc_timestamp: true

embedding:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen3-embedding:8b
  dimensions: 4096
  truncate: true
  max_chars: 6000
  batch_size: 8
  keep_alive: 2h
  request_timeout_s: 1800
  options:
    num_thread: 8
    num_batch: 64

vector_index:
  prefer_faiss: true
  l2_normalize: true

lexical:
  kind: bm25
  tokenizer: regex_v1
  lowercase: true
  max_token_len: 40
  k1: 1.2
  b: 0.75
  min_df: 1
  stopwords: minimal_v1

scoring:
  w_lex: 0.55
  w_emb: 0.45
  layer_prior:
    mineru: 1.10
    docling: 1.00
    pymupdf: 0.95
  structure_span_boost: 1.10
  noncanonical_page_penalty: 0.85

navigate:
  top_patches: 8

fetch:
  top_blocks: 12

eval:
  ks: [1, 3, 5, 10]
  patch_heading_eval_max_queries: 25
  kc_title_eval_max_queries: 25

smoke_queries:
  - information gain entropy gini split criterion
  - naive bayes conditional independence
  - silhouette coefficient
  - feature selection mutual information
