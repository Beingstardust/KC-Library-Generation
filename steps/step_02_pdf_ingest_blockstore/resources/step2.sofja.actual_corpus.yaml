project:
  timezone: "Europe/Amsterdam"

doc:
  doc_id: "DOC_EXAMPLE"
  pdf_path: "data/input/course_materials/example.pdf"

  freeze_inputs: true
  frozen_store_dir: "/beegfs2/scratch/aryp26yc/kc_l/data/raw/frozen"

output:
  processed_blockstore_dir: "/beegfs2/scratch/aryp26yc/kc_l/data/processed/blockstore"
  runs_dir: "/beegfs2/scratch/aryp26yc/kc_l/data/runs"

  render_page_images: true
  render_dpi: 144
  render_format: "png"

  work_dir: "/beegfs2/scratch/aryp26yc/kc_l/data/work"
  use_work_dir_for_external_tools: true
  keep_work_dir: false

layers:
  pymupdf:
    enabled: true
    extract_blocks: true
    sort_text: true
    write_raw_dump: true

  docling:
    enabled: true
    cli: "/home/aryp26yc/venvs/docling_cli/bin/docling"
    to_format: "json"
    pipeline: "standard"
    pdf_backend: "docling_parse"
    artifacts_path: "/beegfs2/scratch/aryp26yc/kc_l/docling_hf_models"
    ocr: false
    tables: true
    abort_on_error: false
    show_layout: false
    extra_args: []
    chunking:
      enabled: true
      threshold_pages: 300
      pages_per_chunk: 100

  mineru:
    enabled: true
    cli: "/home/aryp26yc/venvs/mineru_cli/bin/mineru"
    backend: "pipeline"
    extra_args:
      - "--source"
      - "local"
      - "--device"
      - "cpu"
      - "--lang"
      - "en"
      - "--method"
      - "auto"

validation:
  min_pages: 1
  min_total_blocks: 20
  require_each_enabled_layer_nonempty: true

logging:
  verbose: true
