    "weights": {
      "exact_name_phrase": 6.0,
      "exact_alias_phrase": 4.0,
      "canonical_token_hit": 2.5,
      "alias_token_hit": 1.5,
      "definitional_cue_hit": 1.75,
      "heading_name_hit": 0.75,
      "block_alignment_score": 0.05,
      "block_retrieval_score": 0.5,
      "early_rank_bonus": 0.2,
      "soft_short_penalty": 2.5
