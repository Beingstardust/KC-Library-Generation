      " is an ",
      " is the ",
      " refers to ",
      " defined as ",
      " can be defined as ",
      " denotes ",
      " measures ",
      " quantifies ",
      " algorithm",
      " procedure",
      " metric",
      " coefficient",
      " ratio",
      " probability",
      " distance",
      " similarity",
      " score",
      " assumption",
      " theorem",
      " claim"
